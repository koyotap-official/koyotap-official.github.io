<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Glowline Pipes — Campaign</title>
    <link rel="icon" href="./assets/glowline-icon.png" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1220;
        touch-action: none;
        user-select: none;
      }
      canvas {
        display: block;
      }
      #game-loading {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        place-items: center;
        background: #18221f;
        color: #e9e4d5;
        opacity: 1;
        transition: opacity 140ms ease-out;
      }
      #game-loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .game-loading-card {
        display: flex;
        width: min(76vw, 360px);
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
      }
      .game-loading-mark {
        display: block;
        width: min(20vw, 80px);
        aspect-ratio: 1;
        object-fit: contain;
      }
      .game-loading-title {
        margin: 0;
        color: #e9e4d5;
        font: 800 clamp(16px, 4.5vw, 22px)/1.1 system-ui, sans-serif;
        letter-spacing: .045em;
      }
      .game-loading-rail {
        width: min(60vw, 180px);
        height: 4px;
        overflow: hidden;
        border: 1px solid rgba(176, 239, 200, .2);
        border-radius: 999px;
        background: rgba(176, 239, 200, .1);
      }
      .game-loading-rail::after {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: #b0efc8;
        box-shadow: 0 0 14px rgba(68, 255, 184, .58);
        content: "";
        animation: game-loading-progress 1.25s ease-in-out infinite alternate;
      }
      .game-loading-copy {
        margin: -4px 0 0;
        color: #a1aba4;
        font: 14px/1.2 system-ui, sans-serif;
      }
      @keyframes game-loading-progress {
        from { transform: translateX(0); }
        to { transform: translateX(164%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #game-loading { transition: none; }
        .game-loading-rail::after { animation: none; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-w6fTm_hS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DNcrnOwu.css">
  </head>
  <body>
    <div id="game-loading" role="status" aria-live="polite">
      <div class="game-loading-card">
        <img class="game-loading-mark" src="./assets/glowline-title-mark.png" alt="" aria-hidden="true" />
        <h1 class="game-loading-title">GLOWLINE PIPES</h1>
        <div class="game-loading-rail" aria-hidden="true"></div>
        <p class="game-loading-copy" id="game-loading-copy">Loading…</p>
      </div>
    </div>
    <div id="game-root" aria-label="Glowline Pipes game"></div>
  </body>
</html>
