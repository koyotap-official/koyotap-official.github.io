<!doctype html>
<html lang="ja" data-lang="ja"
  data-title-ja="ページが見つかりません — KoyoTap"
  data-title-en="Page not found — KoyoTap">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ページが見つかりません — KoyoTap</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/assets/koyotap-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/site.css">

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("koyotap-lang");
          var lang = saved || (String(navigator.language || "").toLowerCase().indexOf("ja") === 0 ? "ja" : "en");
          document.documentElement.setAttribute("data-lang", lang);
          document.documentElement.setAttribute("lang", lang);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="/" aria-label="KoyoTap">
          <svg viewBox="0 0 372 370" aria-hidden="true">
            <rect x="0" y="38" width="168" height="168" rx="50" fill="#2f7bff"/>
            <rect x="144" y="0" width="168" height="168" rx="50" fill="#ff4a3d"/>
            <rect x="42" y="202" width="168" height="168" rx="50" fill="#ffd23f"/>
            <rect x="204" y="160" width="168" height="168" rx="50" fill="#22b573"/>
          </svg>
          <span>KoyoTap</span>
        </a>
        <div class="lang-switch" role="group" aria-label="Language / 言語">
          <button type="button" data-set-lang="ja" aria-pressed="true">JA</button>
          <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main class="container" style="padding: 112px 24px 128px; max-width: 640px;">
      <p class="eyebrow">404</p>
      <h1 style="margin:0 0 14px;font-size:clamp(24px,4vw,32px);">
        <span data-l="ja" lang="ja">ページが見つかりません</span>
        <span data-l="en" lang="en">Page not found</span>
      </h1>
      <p style="color:var(--text-muted);margin:0 0 28px;" data-l="ja" lang="ja">
        お探しのページは移動または削除された可能性があります。
      </p>
      <p style="color:var(--text-muted);margin:0 0 28px;" data-l="en" lang="en">
        The page you were looking for may have moved or been removed.
      </p>
      <a class="button button--primary" href="/">
        <span data-l="ja" lang="ja">トップページへ</span><span data-l="en" lang="en">Go to home</span>
      </a>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>&copy; 2026 KoyoTap</span>
        <div class="footer-links">
          <a href="/privacy-policy.html">
            <span data-l="ja" lang="ja">プライバシーポリシー</span><span data-l="en" lang="en">Privacy Policy</span>
          </a>
        </div>
      </div>
    </footer>

    <script src="/assets/site.js"></script>
  </body>
</html>
