<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>腹を割って話す・完成動画</title><style>body{margin:0;background:#efe3cc;color:#30291b;text-align:center;font:16px system-ui}main{max-width:520px;margin:auto;padding:12px}h1{font-size:22px;margin:8px}video{display:block;max-height:78vh;max-width:100%;margin:8px auto;border-radius:16px;background:#efe3cc}button{font:inherit;background:#fff7e6;border:1px solid #b59b67;border-radius:14px;padding:12px 28px;min-height:48px;cursor:pointer}p{font-size:14px}</style><main><h1>腹を割って話す・12秒版</h1><video id="movie" controls playsinline preload="auto" src="./promo-ja-v2.mp4"></video><button id="play">再生する</button><p id="state" role="status">読み込み中…</p></main><script>const v=document.querySelector('video'),s=document.querySelector('#state');document.querySelector('#play').onclick=()=>{v.play().catch(e=>s.textContent=String(e))};function update(){s.textContent=v.error?'動画の読み込みに失敗しました':v.ended?'最後まで再生できました':Number.isFinite(v.duration)?`${v.currentTime.toFixed(1)} / ${v.duration.toFixed(1)} 秒`:'読み込み中…';s.dataset.ended=String(v.ended);s.dataset.error=String(v.error?.code??0);s.dataset.width=String(v.videoWidth);s.dataset.height=String(v.videoHeight)}['loadedmetadata','timeupdate','ended','error'].forEach(e=>v.addEventListener(e,update));</script></html>
